<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Computer Praxen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--glass:rgba(255,255,255,.76);--card:#ffffff;--ink:#0b0b10;--ink2:#55555f;--ink3:#6c6c76;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--seg:#ffffff;--accent:#2447e6;--onaccent:#ffffff;--accentsoft:rgba(36,71,230,.1);--danger:#d70015;--shadow:0 12px 40px rgba(20,24,40,.16),0 1px 2px rgba(20,24,40,.08);--frame:#d9d9de}
.dark{--glass:rgba(30,30,34,.74);--card:#2c2c31;--ink:#f5f5f7;--ink2:#a7a7b0;--ink3:#8f8f99;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--seg:#5f5f66;--accent:#6f8cff;--onaccent:#06102e;--accentsoft:rgba(111,140,255,.16);--danger:#ff453a;--shadow:0 12px 40px rgba(0,0,0,.55);--frame:#000000}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);box-shadow:var(--shadow);border:0.5px solid var(--line)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:var(--fill);box-shadow:inset 0 -1px 0 var(--line);font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;font-size:12px;color:var(--ink2)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:var(--accent)}a:hover{opacity:.8}
</style>
</helmet>
<div style="width: 1280px; height: 1648px; display: flex; flex-direction: column; gap: 48px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="position: relative; width: 1280px; height: 800px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: var(--frame); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif">
<div style="position: absolute; inset: 0">
<dc-import name="Map" theme="{{t.cls}}" mode="pins" focus="2" vb="159 24 1000 625" w="1280" h="800" hint-size="1280px,800px"></dc-import>
</div>
<aside class="glass" style="position: absolute; top: 16px; left: 16px; bottom: 16px; width: 380px; box-sizing: border-box; border-radius: 26px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Zurück zur Eingabe" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: var(--fill); display: flex; align-items: center; justify-content: center"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<h1 style="margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Orthopädie</h1>
<span style="font-size: 13px; color: var(--ink2)">„mein knie tut seit dem fußball weh“</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; height: 40px; box-sizing: border-box; border-radius: 11px; background: var(--fill); font-size: 13px; font-weight: 500">
<button style="border-radius: 9px; background: var(--seg); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600">Schnellste</button>
<button style="border-radius: 9px">Nächste</button>
<button style="border-radius: 9px">Barrierefrei</button>
</div>
<span style="font-size: 12px; color: var(--ink3); padding: 0 4px">5 Praxen · Fahrzeit ab deinem Standort, jetzt</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{praxen}}" as="p" hint-placeholder-count="5">
<button style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; text-align: left; background: {{p.bg}}; box-shadow: {{p.ring}}">
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 12px; color: var(--ink2)">{{p.adr}}</span>
<span style="display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; color: var(--ink2)">
<sc-for list="{{p.segs}}" as="s" hint-placeholder-count="3">
<sc-if value="{{s.sep}}" hint-placeholder-val="{{ false }}"><span style="color: var(--ink3)">›</span></sc-if>
<sc-if value="{{s.walk}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 2px"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M9 21l2.5-6.5L14 17v4M8 12l2.5-4 3.5 1 2 3M11.5 14.5L10.5 9"></path></svg><span class="mono">{{s.label}}</span></span></sc-if>
<sc-if value="{{s.line}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-weight: 700; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</span></sc-if>
</sc-for>
</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1">
<span class="mono" style="font-size: 26px; font-weight: 600; letter-spacing: -0.03em">{{p.min}}</span>
<span style="font-size: 12px; color: var(--ink2); margin-top: 3px">Min</span>
</span>
</button>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; gap: 14px; padding: 0 4px; font-size: 12px; color: var(--ink3)">
<span style="display: flex; align-items: center; gap: 5px"><span class="kbd">↑</span><span class="kbd">↓</span> wählen</span>
<span style="display: flex; align-items: center; gap: 5px"><span class="kbd">↵</span> öffnen</span>
<span style="display: flex; align-items: center; gap: 5px"><span class="kbd">esc</span> zurück</span>
</div>
</aside>
<div class="glass" style="position: absolute; top: 20px; right: 20px; border-radius: 24px; display: flex; padding: 2px">
<button aria-label="Termine" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></button>
<button aria-label="Über Lotse" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
</div>
<div style="position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end">
<button class="glass" aria-label="Mein Standort" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--accent)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4L4 11l7 2 2 7z"></path></svg></button>
<div class="glass" style="border-radius: 14px; display: flex; flex-direction: column; overflow: hidden">
<button aria-label="Vergrößern" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<span style="height: 1px; background: var(--line)"></span>
<button aria-label="Verkleinern" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1648}}'>
class Component extends DCLogic {
  renderVals() {
    const W = (m) => ({ walk: true, line: false, label: m });
    const L = (label, kind) => ({
      walk: false, line: true, label,
      bg: kind === 'tram' ? 'var(--accent)' : kind === 's' ? '#1f7a4a' : 'var(--ink)',
      fg: kind === 'tram' ? 'var(--onaccent)' : kind === 's' ? '#ffffff' : 'var(--card)'
    });
    const seq = (arr) => arr.map((s, i) => Object.assign({ sep: i > 0 }, s));
    const praxen = [
      { name: 'Orthopädie am Markt', adr: 'Lindenstraße 12 · 1,2 km', min: '9', segs: seq([W('3'), L('Tram 12', 'tram'), W('2')]) },
      { name: 'Gemeinschaftspraxis Lindenhof', adr: 'Am Lindenhof 4 · 1,9 km · barrierefrei', min: '14', segs: seq([W('6'), L('Bus 36', 'bus'), W('2')]) },
      { name: 'Gelenkzentrum Altstadt', adr: 'Kirchgasse 7 · 1,4 km', min: '17', segs: seq([W('17')]) },
      { name: 'Orthopädie am Hafen', adr: 'Hafenstraße 21 · 2,6 km · barrierefrei', min: '21', segs: seq([W('2'), L('S3', 's'), L('Bus 30', 'bus'), W('3')]) },
      { name: 'Praxis am Nordring', adr: 'Nordring 88 · 3,1 km', min: '24', segs: seq([W('4'), L('Tram 12', 'tram'), W('6')]) }
    ].map((p, i) => Object.assign(p, {
      bg: i === 1 ? 'var(--accentsoft)' : 'var(--card)',
      ring: i === 1 ? 'inset 0 0 0 1.5px var(--accent)' : 'none'
    }));
    return { themes: [{ cls: 'light' }, { cls: 'dark' }], praxen };
  }
}
</script>
</body>
</html>
