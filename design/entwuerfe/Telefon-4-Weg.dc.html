<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Telefon Weg</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--glass:rgba(255,255,255,.76);--card:#ffffff;--ink:#0b0b10;--ink2:#55555f;--ink3:#6c6c76;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--seg:#ffffff;--accent:#2447e6;--onaccent:#ffffff;--accentsoft:rgba(36,71,230,.1);--danger:#d70015;--dangerdeep:#c00013;--wash:rgba(206,0,20,.9);--shadow:0 12px 40px rgba(20,24,40,.16),0 1px 2px rgba(20,24,40,.08);--frame:#d9d9de}
.dark{--glass:rgba(30,30,34,.74);--card:#2c2c31;--ink:#f5f5f7;--ink2:#a7a7b0;--ink3:#8f8f99;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--seg:#5f5f66;--accent:#6f8cff;--onaccent:#06102e;--accentsoft:rgba(111,140,255,.16);--danger:#ff453a;--dangerdeep:#b3000f;--wash:rgba(110,6,14,.93);--shadow:0 12px 40px rgba(0,0,0,.55);--frame:#000000}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);box-shadow:var(--shadow);border:0.5px solid var(--line)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:var(--accent)}a:hover{opacity:.8}
</style>
</helmet>
<div style="width: 828px; height: 844px; display: flex; gap: 48px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="position: relative; width: 390px; height: 844px; flex-shrink: 0; border-radius: 48px; overflow: hidden; background: var(--frame); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif">
<div style="position: absolute; inset: 0">
<dc-import name="Map" theme="{{t.cls}}" mode="route" focus="1" vb="520 188 520 1126" w="390" h="844" hint-size="390px,844px"></dc-import>
</div>
<button class="glass" aria-label="Zurück zur Liste" style="position: absolute; top: 58px; left: 16px; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center">
<svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div class="glass" style="position: absolute; left: 0; right: 0; bottom: 0; top: 296px; border-radius: 34px 34px 0 0; padding: 8px 20px 26px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 36px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: 0.45; margin: 0 auto"></div>
<div style="display: flex; flex-direction: column; gap: 3px">
<h1 style="margin: 0; font-size: 21px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em">Orthopädie am Markt</h1>
<span style="font-size: 13px; color: var(--ink2)">Termin Mo, 2. Nov · <span class="mono">08:45</span></span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: var(--ink2)">Losgehen um</span>
<span class="mono" style="font-size: 50px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; color: var(--accent)">08:23</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; padding-bottom: 4px">
<span style="font-size: 15px; font-weight: 600">an <span class="mono">08:35</span></span>
<span style="font-size: 13px; color: var(--ink2)">10 Min Puffer</span>
</div>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: grid; grid-template-columns: 44px 28px minmax(0, 1fr); gap: 8px; align-items: center">
<span class="mono" style="font-size: 13px; color: var(--ink2)">08:23</span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; justify-content: center"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M9 21l2.5-6.5L14 17v4M8 12l2.5-4 3.5 1 2 3M11.5 14.5L10.5 9"></path></svg></span>
<span style="font-size: 15px">3 Min zu Fuß <span style="color: var(--ink2)">bis Am Markt</span></span>
</li>
<li style="display: grid; grid-template-columns: 44px 28px minmax(0, 1fr); gap: 8px; align-items: center">
<span class="mono" style="font-size: 13px; color: var(--ink2)">08:27</span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="13" rx="3"></rect><path d="M6 11h12M9 20l-1.5 1.5M15 20l1.5 1.5"></path></svg></span>
<span style="font-size: 15px"><b style="font-weight: 600">Tram 12</b> <span style="color: var(--ink2)">Richtung Nordring, 4 Stationen</span></span>
</li>
<li style="display: grid; grid-template-columns: 44px 28px minmax(0, 1fr); gap: 8px; align-items: center">
<span class="mono" style="font-size: 13px; color: var(--ink2)">08:33</span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: var(--fill); display: flex; align-items: center; justify-content: center"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"></circle><path d="M9 21l2.5-6.5L14 17v4M8 12l2.5-4 3.5 1 2 3M11.5 14.5L10.5 9"></path></svg></span>
<span style="font-size: 15px">2 Min zu Fuß <span style="color: var(--ink2)">bis Lindenstraße 12</span></span>
</li>
</ol>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--ink3)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); padding-top: 2px">PLAN B</span>
<span style="font-size: 14px; line-height: 1.4; color: var(--ink2)">Fällt Tram 12 aus: <b style="color: var(--ink); font-weight: 600">Bus 36</b> um <span class="mono">08:29</span>, an <span class="mono">08:41</span>.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<a href="#buchung" style="height: 52px; border-radius: 16px; background: var(--accent); color: var(--onaccent); text-decoration: none; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
Bei der Praxis buchen
<svg class="ic" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 48px; border-radius: 14px; background: var(--fill); font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg class="ic" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
In Kalender
</button>
<button style="height: 48px; border-radius: 14px; background: var(--fill); font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg class="ic" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"></path></svg>
Begleitung
</button>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":828,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ cls: 'light' }, { cls: 'dark' }] };
  }
}
</script>
</body>
</html>
