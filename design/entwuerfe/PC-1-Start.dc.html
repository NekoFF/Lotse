<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Computer Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.light{--glass:rgba(255,255,255,.76);--card:#ffffff;--ink:#0b0b10;--ink2:#55555f;--ink3:#6c6c76;--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);--seg:#ffffff;--accent:#2447e6;--onaccent:#ffffff;--accentsoft:rgba(36,71,230,.1);--danger:#d70015;--shadow:0 12px 40px rgba(20,24,40,.16),0 1px 2px rgba(20,24,40,.08);--frame:#d9d9de}
.dark{--glass:rgba(30,30,34,.74);--card:#2c2c31;--ink:#f5f5f7;--ink2:#a7a7b0;--ink3:#8f8f99;--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);--seg:#5f5f66;--accent:#6f8cff;--onaccent:#06102e;--accentsoft:rgba(111,140,255,.16);--danger:#ff453a;--shadow:0 12px 40px rgba(0,0,0,.55);--frame:#000000}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);box-shadow:var(--shadow);border:0.5px solid var(--line)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:var(--fill);box-shadow:inset 0 -1px 0 var(--line);font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;font-size:12px;color:var(--ink2)}
.chip{height:36px;padding:0 12px;border-radius:18px;background:var(--fill);font-size:14px;font-weight:500}
.chip:hover{background:var(--accentsoft);color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit;border:0;background:transparent;outline:none}
input::placeholder{color:var(--ink3)}
a{color:var(--accent)}a:hover{opacity:.8}
</style>
</helmet>
<div style="width: 1280px; height: 1648px; display: flex; flex-direction: column; gap: 48px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="position: relative; width: 1280px; height: 800px; flex-shrink: 0; border-radius: 16px; overflow: hidden; background: var(--frame); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui, sans-serif">
<div style="position: absolute; inset: 0">
<dc-import name="Map" theme="{{t.cls}}" mode="plain" focus="0" vb="-33 45 1200 750" w="1280" h="800" hint-size="1280px,800px"></dc-import>
</div>
<aside class="glass" style="position: absolute; top: 16px; left: 16px; bottom: 16px; width: 380px; box-sizing: border-box; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600">
<span style="width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 L16 17 L10 13.5 L4 17 Z" style="fill: var(--onaccent)"></path></svg></span>
Lotse
</span>
<span style="font-size: 12px; color: var(--ink3)">Wegweiser, keine Diagnose</span>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Was ist los?</h1>
<label style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 12px 0 14px; border-radius: 14px; background: var(--fill); color: var(--ink3)">
<svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span class="sr">Anliegen in eigenen Worten</span>
<input placeholder="In eigenen Worten beschreiben" style="flex: 1; min-width: 0; font-size: 16px; color: var(--ink)">
<span class="kbd">/</span>
</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="chip">Zahn abgebrochen</button>
<button class="chip">Ausschlag am Arm</button>
<button class="chip">Ohr tut seit gestern weh</button>
<button class="chip">Rücken nach dem Heben</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">Deine Termine</h2>
<a href="#termine" style="font-size: 13px; text-decoration: none">Alle</a>
</div>
<button style="display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); text-align: left">
<span style="height: 48px; border-radius: 12px; background: var(--accentsoft); color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em">MO</span>
<span class="mono" style="font-size: 18px; font-weight: 600">2</span>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Orthopädie am Markt</span>
<span style="font-size: 13px; color: var(--ink2)">Termin <span class="mono">08:45</span> · losgehen <span class="mono" style="color: var(--accent); font-weight: 600">08:23</span></span>
</span>
</button>
<button style="display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); text-align: left">
<span style="height: 48px; border-radius: 12px; background: var(--fill); color: var(--ink2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05">
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em">DO</span>
<span class="mono" style="font-size: 18px; font-weight: 600">12</span>
</span>
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">Zahnarztpraxis am Hafen</span>
<span style="font-size: 13px; color: var(--ink2)">Termin <span class="mono">16:10</span> · mit Begleitung</span>
</span>
</button>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2)">
<span style="display: flex; align-items: center; gap: 8px">
<svg class="ic" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger)"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"></path></svg>
Akuter Notfall: <a href="tel:112" style="color: var(--danger); font-weight: 700">112</a> · Bereitschaftsdienst <a href="tel:116117" style="font-weight: 600">116 117</a>
</span>
<span style="color: var(--ink3)">Eingaben bleiben auf diesem Gerät.</span>
</div>
</aside>
<div class="glass" style="position: absolute; top: 20px; right: 20px; border-radius: 24px; display: flex; padding: 2px">
<button aria-label="Termine" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></button>
<button aria-label="Über Lotse" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
</div>
<div style="position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end">
<button class="glass" aria-label="Mein Standort" style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--accent)"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4L4 11l7 2 2 7z"></path></svg></button>
<div class="glass" style="border-radius: 14px; display: flex; flex-direction: column; overflow: hidden">
<button aria-label="Vergrößern" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<span style="height: 1px; background: var(--line)"></span>
<button aria-label="Verkleinern" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1648}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ cls: 'light' }, { cls: 'dark' }] };
  }
}
</script>
</body>
</html>
