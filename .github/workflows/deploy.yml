name: Testen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Projektseite und App zusammenstellen
        env:
          # Die App wird erst veröffentlicht, wenn dieser Schalter auf "true" steht.
          APP_VEROEFFENTLICHEN: "false"
        run: |
          mkdir -p out
          cp -r site/. out/
          if [ "$APP_VEROEFFENTLICHEN" = "true" ]; then
            mkdir -p out/app
            cp -r dist/. out/app/
          else
            echo "App wird noch nicht veröffentlicht."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
